apiVersion: apps/v1
kind: Deployment
metadata:
  name: report-service
  namespace: lissa-fit
  labels:
    app: report-service
    version: v1
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: report-service
  template:
    metadata:
      labels:
        app: report-service
        version: v1
      annotations:
        prometheus.io/port: "8086"
    spec:
      terminationGracePeriodSeconds: 30
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z wa-postgres 5432; do echo waiting for postgres; sleep 2; done;']
        - name: wait-for-redis
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z wa-redis 6379; do echo waiting for redis; sleep 2; done;']
        - name: wait-for-minio
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z minio 9000; do echo waiting for minio; sleep 2; done;']
        - name: wait-for-storage-service
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z storage-service 80; do echo waiting for storage-service; sleep 2; done;']

      containers:
        - name: report-service
          image: mihailovpasha/report-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8086
              name: http
              protocol: TCP

          env:
            - name: JAVA_OPTS
              value: "-XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0 -XX:InitialRAMPercentage=50.0 -XX:+UseG1GC -XX:MaxGCPauseMillis=200"
            - name: DB_URL
              valueFrom:
                configMapKeyRef:
                  name: report-service-config
                  key: DB_URL
            - name: DB_URL_BASE
              valueFrom:
                configMapKeyRef:
                  name: report-service-config
                  key: DB_URL_BASE
            - name: DB_SCHEMA
              valueFrom:
                configMapKeyRef:
                  name: report-service-config
                  key: DB_SCHEMA
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: report-service-secrets
                  key: DB_USERNAME
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: report-service-secrets
                  key: DB_PASSWORD
            - name: REDIS_HOST
              valueFrom:
                configMapKeyRef:
                  name: report-service-config
                  key: REDIS_HOST
            - name: REDIS_PORT
              valueFrom:
                configMapKeyRef:
                  name: report-service-config
                  key: REDIS_PORT
            - name: REDIS_TIMEOUT
              valueFrom:
                configMapKeyRef:
                  name: report-service-config
                  key: REDIS_TIMEOUT
            - name: STORAGE_SERVICE_BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: report-service-config
                  key: STORAGE_SERVICE_BASE_URL
            - name: STORAGE_SERVICE_PATH
              valueFrom:
                configMapKeyRef:
                  name: report-service-config
                  key: STORAGE_SERVICE_PATH
            - name: STORAGE_SERVICE_TIMEOUT
              valueFrom:
                configMapKeyRef:
                  name: report-service-config
                  key: STORAGE_SERVICE_TIMEOUT
            - name: AWS_S3_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: report-service-secrets
                  key: AWS_S3_ACCESS_KEY_ID
            - name: AWS_S3_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: report-service-secrets
                  key: AWS_S3_SECRET_ACCESS_KEY
            - name: AWS_S3_REGION
              valueFrom:
                configMapKeyRef:
                  name: report-service-config
                  key: AWS_S3_REGION
            - name: AWS_S3_ENDPOINT_INTERNAL
              valueFrom:
                configMapKeyRef:
                  name: report-service-config
                  key: AWS_S3_ENDPOINT_INTERNAL
            - name: AWS_S3_ENDPOINT_PUBLIC
              valueFrom:
                configMapKeyRef:
                  name: report-service-config
                  key: AWS_S3_ENDPOINT_PUBLIC
            - name: AWS_S3_PATH_STYLE_ACCESS
              valueFrom:
                configMapKeyRef:
                  name: report-service-config
                  key: AWS_S3_PATH_STYLE_ACCESS
            - name: AWS_S3_BUCKET_NAME
              valueFrom:
                configMapKeyRef:
                  name: report-service-config
                  key: AWS_S3_BUCKET_NAME
            - name: AWS_S3_PRESIGNED_URL_EXPIRATION
              valueFrom:
                configMapKeyRef:
                  name: report-service-config
                  key: AWS_S3_PRESIGNED_URL_EXPIRATION
            - name: AWS_S3_REPORT_PREFIX
              valueFrom:
                configMapKeyRef:
                  name: report-service-config
                  key: AWS_S3_REPORT_PREFIX
            - name: REPORT_DELETION_CRON
              valueFrom:
                configMapKeyRef:
                  name: report-service-config
                  key: REPORT_DELETION_CRON
            - name: JWT_SECRET_ACCESS
              valueFrom:
                secretKeyRef:
                  name: report-service-secrets
                  key: JWT_SECRET_ACCESS
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "1000m"